<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <title>Unity WebGL Player | PussyIsland</title>
    <link rel="shortcut icon" href="TemplateData/favicon.ico">
    <link rel="stylesheet" href="TemplateData/style.css">
  </head>
  <body>
<div id="unity-container">
    <div class="unity-wrapper">
      <canvas id="unity-canvas"></canvas>
      <div id="unity-fullscreen-button"></div>
<div id="logo-div" style="position:absolute; inset:0;">    
		<img src="https://cdn23043903.ahacdn.me/TemplateData/bulka-logo.png" style="width:100%;height:100%;object-fit:cover;">
		<img id="progress-bar-primary"
		src="https://cdn23043903.ahacdn.me/TemplateData/progress-bar-full.png"
		style="position:absolute; bottom:0; left:0; height:10px; width:0%;">
	</div>

    </div>
    </div>
   <script src="TemplateData/aspect.js"></script>
    <script>

	  let gameInstance;
      var container = document.querySelector("#unity-container");
      var canvas = document.querySelector("#unity-canvas");
      var bar = document.querySelector("#progress-bar-primary");
	var barParent = document.querySelector("#logo-div");
      var fullscreenButton = document.querySelector("#unity-fullscreen-button");
      var buildUrl = "Build";
      var loaderUrl = buildUrl + "/Test_Map.loader.js";

      var config = {
        dataUrl: buildUrl + "/Test_Map.data.unityweb",
        frameworkUrl: buildUrl + "/Test_Map.framework.js.unityweb",
        codeUrl: buildUrl + "/Test_Map.wasm.unityweb",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "Bulkagames",
        productName: "PussyIsland",
        productVersion: "2.1.7",
        showBanner: unityShowBanner,
      };

      // By default, Unity keeps WebGL canvas render target size matched with
      // the DOM size of the canvas element (scaled by window.devicePixelRatio)
      // Set this to false if you want to decouple this synchronization from
      // happening inside the engine, and you would instead like to size up
      // the canvas DOM size and WebGL render target sizes yourself.
      // config.matchWebGLToCanvasSize = false;

      

      canvas.style.background = "url('" + buildUrl + "/Test_Map.jpg') center / cover";
      //loadingBar.style.display = "block";

      var script = document.createElement("script");
      script.src = loaderUrl;
      script.onload = () => {
        createUnityInstance(canvas, config, (progress) => {
          progressBarFull.style.width = 100 * progress + "%";
              }).then((unityInstance) => {
			  gameInstance = unityInstance;
                bar.style.display = "none";
                fullscreenButton.onclick = () => {
                  unityInstance.SetFullscreen(1);
                };
              }).catch((message) => {
                alert(message);
              });
            };

      document.body.appendChild(script);

    </script>
  </body>
</html>
